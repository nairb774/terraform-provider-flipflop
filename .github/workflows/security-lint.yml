name: Security Linting

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  zizmor:
    name: GitHub Actions Security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # To upload to GitHub Advanced Security
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify shellcheck is available
        run: |
          # Verify shellcheck is available for zizmor to use
          # shellcheck is pre-installed on GitHub Actions ubuntu runners
          shellcheck --version

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          persona: pedantic
